name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build e publicação
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Instalar dependências
        run: npm ci

      - name: Verificar código
        run: npm run lint

      - name: Gerar site
        run: npm run build

      - name: Autenticar no Google Cloud via WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: fercarvalho-gcp
          workload_identity_provider: projects/372340900872/locations/global/workloadIdentityPools/github-portfolio/providers/github
          service_account: portfolio-deploy@fercarvalho-gcp.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Publicar no Firebase Hosting
        run: >
          ./node_modules/.bin/firebase deploy
          --only hosting
          --project fercarvalho-gcp
          --non-interactive
